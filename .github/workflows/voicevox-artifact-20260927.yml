name: VOICEVOX Artifact Relay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voicevox-artifact-20260927.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare extractor and download VOICEVOX Engine
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          cp "$(readlink -f "$(command -v 7z)")" 7z-bin
          chmod +x 7z-bin
          ./7z-bin i | head -20
          curl -fL --retry 5 --retry-delay 5 \
            "https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001" \
            -o voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          sha256sum voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          split -b 128M -d -a 2 voicevox_engine-linux-cpu-x64-0.25.2.7z.001 voicevox.part.
          ls -lh voicevox.part.*

      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-7z-extractor
          path: 7z-bin
          compression-level: 0
          retention-days: 1

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-00
          path: voicevox.part.00
          compression-level: 0
          retention-days: 1

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-01
          path: voicevox.part.01
          compression-level: 0
          retention-days: 1

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-02
          path: voicevox.part.02
          compression-level: 0
          retention-days: 1

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-03
          path: voicevox.part.03
          compression-level: 0
          retention-days: 1

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-04
          path: voicevox.part.04
          compression-level: 0
          retention-days: 1

      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-engine-128m-part-05
          path: voicevox.part.05
          compression-level: 0
          retention-days: 1

      - name: Upload part 06
